worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  access_log /dev/stdout;
  client_body_temp_path /tmp/nginx-client-body;
  proxy_temp_path /tmp/nginx-proxy;
  fastcgi_temp_path /tmp/nginx-fastcgi;
  uwsgi_temp_path /tmp/nginx-uwsgi;
  scgi_temp_path /tmp/nginx-scgi;
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;

  # Same semantics as the Vite proxy (rewrite ^/api -> ''): /api/x?y reaches the
  # backend as /x?y. Taken from $request_uri so the raw (still-encoded) path and
  # query string are forwarded byte for byte, as Vite does.
  map $request_uri $backend_uri {
    "~^/api(?<rest>/.*)$" $rest;
    default /;
  }

  server {
    listen 8080;
    server_name _;
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    root /app/frontend/dist;
    index index.html;

    location = /api {
      proxy_pass http://127.0.0.1:8000/;
      proxy_http_version 1.1;
    }

    location /api/ {
      proxy_pass http://127.0.0.1:8000$backend_uri;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      # SSE: /api/change-streams/feed (permanent) and the streaming module's
      # live feeds; never buffer, and keep idle streams open.
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    location /assets/ {
      try_files $uri =404;
      expires 7d;
      add_header Cache-Control "public, immutable";
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
